name: Build TUNE CORDS (Windows)

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse "build/TuneCords_artefacts/Release/VST3/TUNE CORDS.vst3" "dist/TUNE CORDS.vst3"
          Copy-Item "build/TuneCords_artefacts/Release/Standalone/TUNE CORDS.exe" "dist/TUNE CORDS.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: TUNE-CORDS-Windows
          path: dist
